name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk SousTitresMariage.apk

      - name: Garder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SousTitresMariage-apk
          path: SousTitresMariage.apk

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sous-titres Mariage v${{ github.run_number }}
          files: SousTitresMariage.apk
